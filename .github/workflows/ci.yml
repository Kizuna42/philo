name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (make)
        run: make -C philo

      - name: Check no relink
        run: |
          if make -C philo | grep -q Linking; then
            echo "Makefile relinks unnecessarily" >&2
            exit 1
          fi

      - name: Smoke tests
        run: tests/run_tests.sh philo/philo

      - name: ThreadSanitizer (data races and lock-order inversion)
        env:
          TSAN_OPTIONS: detect_deadlocks=1 second_deadlock_stack=1 halt_on_error=1 exitcode=66
        run: |
          cc -Wall -Wextra -Werror -g -fsanitize=thread -pthread \
            -Iphilo/include philo/src/*.c -o philo_tsan
          for run in 1 2 3; do
            ./philo_tsan 1 800 200 200 > /dev/null
            ./philo_tsan 2 410 200 200 5 > /dev/null
            ./philo_tsan 3 800 200 200 5 > /dev/null
            ./philo_tsan 4 410 200 200 5 > /dev/null
            ./philo_tsan 4 310 200 100 > /dev/null
            ./philo_tsan 5 800 200 200 7 > /dev/null
            ./philo_tsan 200 800 200 200 2 > /dev/null
          done

  norminette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install norminette
        run: pip install norminette
      - name: Run norminette
        run: norminette philo
